    let seleccionados = [];
    let categoriaSeleccionada = "";

    document.addEventListener("DOMContentLoaded", () => {
      cargarBotonesCategorias();
      renderizarLista(estudiosBD);
      if (typeof lucide !== 'undefined') lucide.createIcons();
    });

    function handleOrderUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4';
        loadingDiv.innerHTML = `
            <div class="bg-white rounded-2xl p-6 max-w-sm w-full text-center space-y-3 shadow-2xl">
                <div class="w-10 h-10 border-4 border-pink-200 border-t-[#70006a] rounded-full animate-spin mx-auto"></div>
                <h4 class="font-bold text-slate-800 text-base">Analizando orden con IA...</h4>
                <p class="text-xs text-slate-500">Buscando incompatibilidades...</p>
            </div>
        `;
        document.body.appendChild(loadingDiv);

        setTimeout(() => {
            document.body.removeChild(loadingDiv);
            
            const detectedCodes = ["4018", "4030", "15"]; 
            detectedCodes.forEach(code => {
                const estudio = estudiosBD.find(e => e.codigo === code);
                if (estudio && !seleccionados.some(s => s.codigo === code)) {
                    seleccionados.push(estudio);
                }
            });

            filtrarEstudios();
            actualizarSeleccion();
            actualizarPreparaciones();
            event.target.value = ''; 
        }, 2000);
    }

    function cargarBotonesCategorias() {
      const contenedor = document.getElementById("botonesCategorias");
      const categorias = [...new Set(estudiosBD.map(e => e.categoria))];
      const emojis = { "Hormonas": "🧪", "General": "🔬", "Orina": "💧", "Cultivos": "🧫" };

      let html = `<button onclick="filtrarPorCategoria('')" class="px-3 py-1.5 rounded-lg text-xs font-medium transition ${categoriaSeleccionada === '' ? 'bg-[#70006a] text-white shadow-sm' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">📋 Todos</button>`;
      categorias.forEach(cat => {
        const emoji = emojis[cat] || "🏷️";
        const activo = categoriaSeleccionada === cat;
        html += `<button onclick="filtrarPorCategoria('${cat}')" class="px-3 py-1.5 rounded-lg text-xs font-medium transition ${activo ? 'bg-[#70006a] text-white shadow-sm' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">${emoji} ${cat}</button>`;
      });
      contenedor.innerHTML = html;
    }

    function filtrarPorCategoria(cat) {
      categoriaSeleccionada = cat;
      cargarBotonesCategorias();
      filtrarEstudios();
    }

    function filtrarEstudios() {
      const texto = document.getElementById("buscador").value.toLowerCase();
      const filtrados = estudiosBD.filter(e => {
        const coincidenciaTexto = e.nombre.toLowerCase().includes(texto) || e.codigo.toLowerCase().includes(texto);
        const coincideCat = categoriaSeleccionada === "" || e.categoria === categoriaSeleccionada;
        return coincidenciaTexto && coincideCat;
      });
      renderizarLista(filtrados);
    }

    function renderizarLista(estudios) {
      const contenedor = document.getElementById("listaEstudios");
      document.getElementById("contadorDisponibles").textContent = estudios.length;

      if (estudios.length === 0) {
        contenedor.innerHTML = `<p class="text-slate-400 text-sm text-center py-8">No se encontraron estudios.</p>`;
        return;
      }

      contenedor.innerHTML = estudios.map(e => {
        const estaSeleccionado = seleccionados.some(s => s.codigo === e.codigo);
        return `
          <div onclick="toggleEstudio('${e.codigo}')" class="p-3 border rounded-lg cursor-pointer transition flex items-center justify-between text-sm ${estaSeleccionado ? 'bg-pink-50/80 border-pink-300 shadow-sm' : 'bg-white border-slate-200 hover:border-slate-300'}">
            <div class="flex items-center gap-3">
              <input type="checkbox" ${estaSeleccionado ? 'checked' : ''} onclick="event.stopPropagation(); toggleEstudio('${e.codigo}')" class="rounded text-[#70006a] focus:ring-[#70006a] w-4 h-4 cursor-pointer">
              <div>
                <span class="font-semibold text-slate-800">${e.nombre}</span>
                <span class="text-xs text-slate-500 block">${e.categoria} (Cód: ${e.codigo})</span>
              </div>
            </div>
            ${e.ayunoHoras > 0 ? `<span class="text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-medium whitespace-nowrap">Ayuno ${e.ayunoHoras}h</span>` : ''}
          </div>
        `;
      }).join('');
    }

    function toggleEstudio(codigo) {
      const index = seleccionados.findIndex(s => s.codigo === codigo);
      if (index > -1) {
        seleccionados.splice(index, 1);
      } else {
        const estudio = estudiosBD.find(e => e.codigo === codigo);
        if (estudio) seleccionados.push(estudio);
      }
      filtrarEstudios();
      actualizarSeleccion();
      actualizarPreparaciones();
    }

    function limpiarSeleccion() {
      seleccionados = [];
      filtrarEstudios();
      actualizarSeleccion();
      actualizarPreparaciones();
    }

    function actualizarSeleccion() {
      document.getElementById("contadorSeleccionados").textContent = seleccionados.length;
      const tagsContainer = document.getElementById("tagsSeleccionados");
      const btnWhatsApp = document.getElementById("btnWhatsApp");
      btnWhatsApp.disabled = seleccionados.length === 0;

      if (seleccionados.length === 0) {
        tagsContainer.innerHTML = `<span class="text-xs text-slate-400 italic">Ningún estudio seleccionado</span>`;
        return;
      }

      tagsContainer.innerHTML = seleccionados.map(e => `
        <span class="inline-flex items-center gap-1 bg-pink-100 text-[#70006a] text-xs px-2.5 py-1 rounded-md font-medium">
          ${e.nombre}
          <button onclick="toggleEstudio('${e.codigo}')" class="hover:text-pink-950 font-bold ml-0.5">×</button>
        </span>
      `).join('');
    }

    function actualizarPreparaciones() {
      const preparacionesContenedor = document.getElementById('preparacionesContenedor');
      if (!preparacionesContenedor) return;

      if (seleccionados.length === 0) {
        preparacionesContenedor.innerHTML = `
          <div class="text-center text-slate-500 py-12 print:hidden">
            <i data-lucide="clipboard-list" class="w-16 h-16 mx-auto mb-4 text-slate-300"></i>
            <p class="text-lg">Tus indicaciones aparecerán aquí.</p>
            <p class="text-sm mt-2">Agregá estudios para detectar reglas e incompatibilidades.</p>
          </div>
        `;
        if (typeof lucide !== 'undefined') lucide.createIcons();
        return;
      }

      let alertasIncompatibilidad = [];
      reglasIncompatibilidades.forEach(regla => {
          const hayGrupoA = regla.grupoA.some(cod => seleccionados.some(s => s.codigo === cod));
          const hayGrupoB = regla.grupoB.some(cod => seleccionados.some(s => s.codigo === cod));
          if (hayGrupoA && hayGrupoB) {
              alertasIncompatibilidad.push(regla.mensaje);
          }
      });

      let maxAyuno = 0;
      const preparacionesUnicas = new Set();
      const nombresEstudios = [];

      seleccionados.forEach(e => {
        nombresEstudios.push(e.nombre);
        if (e.ayunoHoras > maxAyuno) maxAyuno = e.ayunoHoras;
        if (e.preparacion && e.preparacion !== "Sin preparación específica") {
          preparacionesUnicas.add(e.preparacion);
        }
      });

      let htmlPreparaciones = ``;

      if (alertasIncompatibilidad.length > 0) {
          htmlPreparaciones += `
            <div class="flex items-start gap-2.5 text-rose-800 bg-rose-50 p-4 rounded-xl text-sm md:text-base mb-4 border border-rose-200 shadow-sm alert-print">
              <i data-lucide="alert-triangle" class="w-6 h-6 flex-shrink-0 mt-0.5 print:hidden text-rose-600"></i>
              <div>
                  <strong class="block mb-2 text-rose-900 text-base">¡Atención! Incompatibilidad detectada:</strong>
                  <ul class="list-disc pl-5 space-y-2">
                      ${alertasIncompatibilidad.map(alerta => `<li>${alerta}</li>`).join('')}
                  </ul>
              </div>
            </div>
          `;
      }

      htmlPreparaciones += `
        <div class="bg-white border border-slate-200 rounded-xl p-5 mb-4 shadow-sm prep-card">
          <div class="mb-5 pb-4 border-b border-slate-200">
            <h3 class="text-indigo-900 font-bold text-lg flex items-center gap-2 mb-3">
               <i data-lucide="list-checks" class="w-5 h-5 text-indigo-500 print:hidden"></i>
               Estudios a realizar:
            </h3>
            <ul class="list-disc pl-5 text-slate-700 text-sm md:text-base space-y-1">
              ${nombresEstudios.map(nombre => `<li><strong>${nombre}</strong></li>`).join('')}
            </ul>
          </div>
      `;

      if (maxAyuno > 0) {
        htmlPreparaciones += `
          <div class="flex items-center gap-2 text-amber-800 bg-amber-50 px-4 py-3 rounded-lg text-sm md:text-base mb-5 border border-amber-200">
            <i data-lucide="clock" class="w-5 h-5 flex-shrink-0 print:hidden"></i>
            <span><strong>Ayuno Mínimo Requerido:</strong> Se requiere un ayuno de <strong>${maxAyuno} horas</strong> antes de la extracción.</span>
          </div>
        `;
      }

      htmlPreparaciones += `
          <div>
            <h4 class="text-indigo-900 font-bold text-md mb-3 flex items-center gap-2">
              <i data-lucide="info" class="w-5 h-5 text-indigo-500 print:hidden"></i>
              Preparaciones adicionales necesarias:
            </h4>
            <div class="text-slate-700 text-sm md:text-base leading-relaxed">
      `;

      if (preparacionesUnicas.size === 0) {
         htmlPreparaciones += `<p class="italic text-slate-500">No se requiere ninguna preparación específica para estos estudios.</p>`;
      } else {
         htmlPreparaciones += `<ul class="list-disc pl-5 space-y-4">`; // Aumentado space-y
         Array.from(preparacionesUnicas).forEach(prep => {
            htmlPreparaciones += `<li><span class="block mb-1">${prep}</span>`;
            
            // Si la preparación está en nuestro mapa, agregamos el botón de descarga
            if (pdfsPreparaciones[prep]) {
                htmlPreparaciones += `
                <a href="${pdfsPreparaciones[prep]}" target="_blank" class="inline-flex items-center gap-1.5 mt-1 bg-pink-50 text-[#70006a] hover:bg-pink-100 border border-pink-200 px-3 py-1.5 rounded-lg text-sm font-semibold transition print:hidden shadow-sm">
                  <i data-lucide="download" class="w-4 h-4"></i> Descargar Instructivo (PDF)
                </a>`;
            }
            
            htmlPreparaciones += `</li>`;
         });
         htmlPreparaciones += `</ul>`;
      }

      htmlPreparaciones += `
            </div>
          </div>
        </div>
        
        <div class="mt-6 p-4 bg-indigo-50 border-l-4 border-indigo-700 rounded-r-lg shadow-sm disclaimer-print">
            <p class="text-indigo-900 print:text-black text-sm md:text-base font-medium flex items-start gap-2">
                <i data-lucide="alert-circle" class="w-5 h-5 flex-shrink-0 mt-0.5 text-indigo-700 print:hidden"></i>
                <span><strong>Aviso importante:</strong> Lea atentamente estas instrucciones, su cumplimiento es imprescindible para garantizar la calidad de sus resultados.</span>
            </p>
        </div>
      `;

      preparacionesContenedor.innerHTML = htmlPreparaciones;
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function enviarWhatsApp() {
      if (seleccionados.length === 0) return;

      let alertasIncompatibilidad = [];
      reglasIncompatibilidades.forEach(regla => {
          const hayGrupoA = regla.grupoA.some(cod => seleccionados.some(s => s.codigo === cod));
          const hayGrupoB = regla.grupoB.some(cod => seleccionados.some(s => s.codigo === cod));
          if (hayGrupoA && hayGrupoB) alertasIncompatibilidad.push(regla.mensaje);
      });

      let maxAyuno = 0;
      const preparacionesUnicas = new Set();
      const nombresEstudios = [];

      seleccionados.forEach(e => {
        nombresEstudios.push(e.nombre);
        if (e.ayunoHoras > maxAyuno) maxAyuno = e.ayunoHoras;
        if (e.preparacion && e.preparacion !== "Sin preparación específica") {
          preparacionesUnicas.add(e.preparacion);
        }
      });

      let mensaje = "*INDICACIONES DE PREPARACIÓN MÉDICA*\n\n";

      if (alertasIncompatibilidad.length > 0) {
        mensaje += "🚫 *ATENCIÓN - ESTUDIOS INCOMPATIBLES:*\n";
        alertasIncompatibilidad.forEach(alerta => {
            mensaje += `• ${alerta}\n`;
        });
        mensaje += "\n";
      }
      
      mensaje += "*Estudios solicitados:*\n";
      nombresEstudios.forEach(nombre => {
        mensaje += `• ${nombre}\n`;
      });

      mensaje += "\n*Resumen de indicaciones:*\n";
      if (maxAyuno > 0) mensaje += `⏰ *Ayuno mínimo:* ${maxAyuno} horas.\n\n`;

      if (preparacionesUnicas.size > 0) {
        mensaje += "*Preparaciones adicionales:*\n";
        Array.from(preparacionesUnicas).forEach(prep => {
            mensaje += `👉 ${prep}\n`;
            // Si la preparación tiene un PDF, lo sumamos al texto del WhatsApp
            if (pdfsPreparaciones[prep]) {
                mensaje += `📄 *Descargar instructivo detallado:* ${pdfsPreparaciones[prep]}\n`;
            }
            mensaje += `\n`;
        });
      } else {
        mensaje += "_No se requiere preparación específica._\n\n";
      }

      mensaje += "⚠️ *Aviso importante:* _Su cumplimiento es imprescindible para garantizar la calidad de sus resultados._\n";

      const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(mensaje)}`;
      
      window.open(url, '_blank');
    }
  </script>
