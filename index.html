<!DOCTYPE html>
<html lang="es">
<head>

  <title>Laboratorio Maipú - Preparaciones Médicas</title>

  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Estilos específicos para la impresión tradicional */
    @media print {
      header > div > button, 
      main > section:first-child, 
      section > div:first-child, 
      section > div:nth-child(2), 
      footer, 
      .p-3.bg-slate-50.border-t.border-slate-200 { 
        display: none !important;
      }
      main {
        grid-template-columns: 1fr !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      main > section:last-child {
        grid-column: 1 / -1 !important;
        box-shadow: none !important;
        border: none !important;
        margin: 0 !important;
        padding: 0 !important;
        height: auto !important;
      }
      h3, h4 { color: black !important; }
      .prep-card {
        border: 1.5pt solid #ccc !important;
        margin-bottom: 15pt !important;
        padding: 15pt !important;
        page-break-inside: avoid;
        box-shadow: none !important;
      }
      .disclaimer-print {
        border-left: 3pt solid #000 !important;
        background: white !important;
        color: black !important;
        page-break-inside: avoid;
        margin-top: 15pt !important;
        padding: 10pt !important;
      }
      body {
        background: white !important;
        color: black !important;
      }
      @page { margin: 1.5cm; }
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-[#70006a] text-white py-5 px-4 shadow-md">
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <img src="image_0.png" alt="Logo de Laboratorio Maipú" class="h-14 w-auto">
        <div class="border-l-2 border-white h-12 ml-2 mr-3"></div>
        <h1 class="text-2xl font-bold leading-tight">Preparaciones para estudios de laboratorio</h1>
      </div>
      <button onclick="window.print()" class="flex md:hidden items-center gap-2 bg-pink-100 text-[#70006a] text-sm font-semibold px-4 py-2 rounded-lg transition shadow hover:bg-pink-200">
        <i data-lucide="printer" class="w-4 h-4"></i> Imprimir
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-grow max-w-6xl w-full mx-auto p-4 grid grid-cols-1 md:grid-cols-12 gap-6 my-6">
    
    <!-- Columna Izquierda: Buscador, Botones de Categorías y Lista de Estudios -->
    <section class="md:col-span-7 flex flex-col gap-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col gap-3">
        <div class="relative w-full">
          <i data-lucide="search" class="w-5 h-5 absolute left-3 top-3 text-slate-400"></i>
          <input 
            type="text" 
            id="buscador" 
            placeholder="Buscar estudio por nombre o código..." 
            oninput="filtrarEstudios()"
            class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#70006a] text-sm"
          >
        </div>
        <!-- Botones de Categorías con Emojis -->
        <div id="botonesCategorias" class="flex flex-wrap gap-1.5 pt-1"></div>
      </div>

      <!-- Contenedor de la Lista con Scroll -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-[460px]">
        <div class="bg-slate-100 px-4 py-3 border-b border-slate-200 font-semibold text-sm text-slate-700 flex justify-between items-center">
          <span>Estudios Disponibles</span>
          <span id="contadorDisponibles" class="text-xs bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full">0</span>
        </div>
        <div id="listaEstudios" class="overflow-y-auto p-3 space-y-2 flex-grow"></div>
      </div>
    </section>

    <!-- Columna Derecha: Estudios Seleccionados e Indicaciones Agrupadas -->
    <section class="md:col-span-5 flex flex-col gap-4">
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col h-[584px]">
        <div class="bg-pink-50 px-4 py-3 border-b border-pink-100 font-semibold text-sm text-[#70006a] flex justify-between items-center">
          <div class="flex items-center gap-2">
            <i data-lucide="check-square" class="w-4 h-4 text-[#70006a]"></i>
            <span>Estudios Seleccionados (<span id="contadorSeleccionados">0</span>)</span>
          </div>
          <button onclick="limpiarSeleccion()" class="text-xs text-[#70006a] hover:underline font-medium">Limpiar todo</button>
        </div>

        <!-- Lista de seleccionados tipo tags o chips -->
        <div id="tagsSeleccionados" class="p-3 border-b border-slate-200 flex flex-wrap gap-1.5 max-h-32 overflow-y-auto bg-slate-50/50">
          <span class="text-xs text-slate-400 italic">Ningún estudio seleccionado</span>
        </div>

        <!-- Contenedor de Preparaciones e Indicaciones -->
        <div class="flex-grow p-4 overflow-y-auto flex flex-col">
          <h3 class="text-sm font-bold text-slate-800 mb-3 flex items-center gap-1.5 print:hidden">
            <i data-lucide="info" class="w-4 h-4 text-[#70006a]"></i> Resumen de Indicaciones
          </h3>
          <div id="preparacionesContenedor" class="flex-grow">
            <div class="text-center text-slate-500 py-12">
              <i data-lucide="clipboard-list" class="w-16 h-16 mx-auto mb-4 text-slate-300"></i>
              <p class="text-base font-medium">Tus indicaciones aparecerán aquí.</p>
              <p class="text-sm mt-2">Usa el buscador para seleccionar los estudios.</p>
            </div>
          </div>
        </div>

        <!-- Botones inferiores: Guardar PDF y WhatsApp -->
        <div class="p-3 bg-slate-50 border-t border-slate-200 flex flex-col sm:flex-row gap-2">
          <button 
            onclick="generarPDF()" 
            id="btnDescargarPdf"
            disabled
            class="flex-1 flex items-center justify-center gap-2 bg-slate-700 hover:bg-slate-800 disabled:bg-slate-300 text-white font-medium py-2.5 px-3 rounded-lg transition text-sm shadow-sm cursor-pointer"
          >
            <i data-lucide="download" class="w-4 h-4"></i> Guardar presupuesto en PDF
          </button>
          <button 
            onclick="enviarWhatsApp()" 
            id="btnWhatsApp"
            disabled
            class="flex-1 flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-medium py-2.5 px-3 rounded-lg transition text-sm shadow-sm cursor-pointer"
          >
            <i data-lucide="message-circle" class="w-5 h-5"></i> Enviar por WhatsApp
          </button>
        </div>
      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="bg-[#70006a] text-white py-4 text-center text-sm mt-6">
    <p>Laboratorio Maipú © 2026 — Todos los derechos reservados</p>
  </footer>

    let seleccionados = [];
    let categoriaSeleccionada = "";

    document.addEventListener("DOMContentLoaded", () => {
      cargarBotonesCategorias();
      renderizarLista(estudiosBD);
      if (typeof lucide !== 'undefined') {
        lucide.createIcons();
      }
    });

    function cargarBotonesCategorias() {
      const contenedor = document.getElementById("botonesCategorias");
      const categorias = [...new Set(estudiosBD.map(e => e.categoria))];
      
      const emojis = {
        "Hormonas": "🧪",
        "General": "🔬",
        "Orina": "💧",
        "Cultivos": "🧫"
      };

      let html = `
        <button onclick="filtrarPorCategoria('')" class="px-3 py-1.5 rounded-lg text-xs font-medium transition ${categoriaSeleccionada === '' ? 'bg-[#70006a] text-white shadow-sm' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">
          📋 Todos
        </button>
      `;

      categorias.forEach(cat => {
        const emoji = emojis[cat] || "🏷️";
        const activo = categoriaSeleccionada === cat;
        html += `
          <button onclick="filtrarPorCategoria('${cat}')" class="px-3 py-1.5 rounded-lg text-xs font-medium transition ${activo ? 'bg-[#70006a] text-white shadow-sm' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">
            ${emoji} ${cat}
          </button>
        `;
      });

      contenedor.innerHTML = html;
    }

    function filtrarPorCategoria(cat) {
      categoriaSeleccionada = cat;
      cargarBotonesCategorias();
      filtrarEstudios();
    }

    function filtrarEstudios() {
      const texto = document.getElementById("buscador").value.toLowerCase();

      const filtrados = estudiosBD.filter(e => {
        const coincidenciaTexto = e.nombre.toLowerCase().includes(texto) || e.codigo.toLowerCase().includes(texto);
        const coincideCat = categoriaSeleccionada === "" || e.categoria === categoriaSeleccionada;
        return coincidenciaTexto && coincideCat;
      });

      renderizarLista(filtrados);
    }

    function renderizarLista(estudios) {
      const contenedor = document.getElementById("listaEstudios");
      document.getElementById("contadorDisponibles").textContent = estudios.length;

      if (estudios.length === 0) {
        contenedor.innerHTML = `<p class="text-slate-400 text-sm text-center py-8">No se encontraron estudios.</p>`;
        return;
      }

      contenedor.innerHTML = estudios.map(e => {
        const estaSeleccionado = seleccionados.some(s => s.codigo === e.codigo);
        return `
          <div 
            onclick="toggleEstudio('${e.codigo}')"
            class="p-3 border rounded-lg cursor-pointer transition flex items-center justify-between text-sm ${estaSeleccionado ? 'bg-pink-50/80 border-pink-300 shadow-sm' : 'bg-white border-slate-200 hover:border-slate-300'}"
          >
            <div class="flex items-center gap-3">
              <input type="checkbox" ${estaSeleccionado ? 'checked' : ''} onclick="event.stopPropagation(); toggleEstudio('${e.codigo}')" class="rounded text-[#70006a] focus:ring-[#70006a] w-4 h-4 cursor-pointer">
              <div>
                <span class="font-semibold text-slate-800">${e.nombre}</span>
                <span class="text-xs text-slate-500 block">${e.categoria} (Código: ${e.codigo})</span>
              </div>
            </div>
            ${e.ayunoHoras > 0 ? `<span class="text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-medium">Ayuno ${e.ayunoHoras}h</span>` : ''}
          </div>
        `;
      }).join('');
    }

    function toggleEstudio(codigo) {
      const index = seleccionados.findIndex(s => s.codigo === codigo);
      if (index > -1) {
        seleccionados.splice(index, 1);
      } else {
        const estudio = estudiosBD.find(e => e.codigo === codigo);
        if (estudio) seleccionados.push(estudio);
      }
      filtrarEstudios();
      actualizarSeleccion();
      actualizarPreparaciones();
    }

    function limpiarSeleccion() {
      seleccionados = [];
      filtrarEstudios();
      actualizarSeleccion();
      actualizarPreparaciones();
    }

    function actualizarSeleccion() {
      document.getElementById("contadorSeleccionados").textContent = seleccionados.length;
      const tagsContainer = document.getElementById("tagsSeleccionados");
      const btnWhatsApp = document.getElementById("btnWhatsApp");
      const btnPdf = document.getElementById("btnDescargarPdf");

      const haySeleccion = seleccionados.length > 0;
      btnWhatsApp.disabled = !haySeleccion;
      btnPdf.disabled = !haySeleccion;

      if (seleccionados.length === 0) {
        tagsContainer.innerHTML = `<span class="text-xs text-slate-400 italic">Ningún estudio seleccionado</span>`;
        return;
      }

      tagsContainer.innerHTML = seleccionados.map(e => `
        <span class="inline-flex items-center gap-1 bg-pink-100 text-[#70006a] text-xs px-2.5 py-1 rounded-md font-medium">
          ${e.nombre}
          <button onclick="toggleEstudio('${e.codigo}')" class="hover:text-pink-950 font-bold ml-0.5">×</button>
        </span>
      `).join('');
    }

    function actualizarPreparaciones() {
      const preparacionesContenedor = document.getElementById('preparacionesContenedor');
      if (!preparacionesContenedor) return;

      if (seleccionados.length === 0) {
        preparacionesContenedor.innerHTML = `
          <div class="text-center text-slate-500 py-12">
            <i data-lucide="clipboard-list" class="w-16 h-16 mx-auto mb-4 text-slate-300"></i>
            <p class="text-base font-medium">Tus indicaciones aparecerán aquí.</p>
            <p class="text-sm mt-2">Usa el buscador para seleccionar los estudios.</p>
          </div>
        `;
        if (typeof lucide !== 'undefined') lucide.createIcons();
        return;
      }

      let maxAyuno = 0;
      const preparacionesUnicas = new Set();
      const nombresEstudios = [];

      seleccionados.forEach(e => {
        nombresEstudios.push(e.nombre);
        if (e.ayunoHoras > maxAyuno) {
          maxAyuno = e.ayunoHoras;
        }
        if (e.preparacion && e.preparacion !== "Sin preparación específica") {
          let prepClean = e.preparacion
            .replace(/Ayuno de \d+\s*(horas|hs)\.?/gi, "")
            .replace(/Puede beber agua con moderación\.?/gi, "")
            .trim();
          if (prepClean) {
            preparacionesUnicas.add(prepClean);
          }
        }
      });

      let htmlPreparaciones = `
        <div class="bg-white border border-slate-200 rounded-xl p-5 mb-4 shadow-sm prep-card">
          <div class="mb-5 pb-4 border-b border-slate-200">
            <h3 class="text-indigo-900 font-bold text-base flex items-center gap-2 mb-3">
               <i data-lucide="list-checks" class="w-5 h-5 text-indigo-500 print:hidden"></i>
               Estudios a realizar:
            </h3>
            <ul class="list-disc pl-5 text-slate-700 space-y-1 text-sm">
              ${nombresEstudios.map(nombre => `<li><strong>${nombre}</strong></li>`).join('')}
            </ul>
          </div>
      `;

      if (maxAyuno > 0) {
        htmlPreparaciones += `
          <div class="flex items-center gap-2 text-amber-800 bg-amber-50 px-4 py-3 rounded-lg text-sm mb-5 border border-amber-200">
            <i data-lucide="clock" class="w-5 h-5 flex-shrink-0 print:hidden"></i>
            <span><strong>Ayuno Mínimo Requerido:</strong> Se requiere un ayuno de <strong>${maxAyuno} horas</strong> antes de la extracción. Puede beber agua con moderación.</span>
          </div>
        `;
      }

      htmlPreparaciones += `
          <div>
            <h4 class="text-indigo-900 font-bold text-base mb-3 flex items-center gap-2">
              <i data-lucide="info" class="w-5 h-5 text-indigo-500 print:hidden"></i>
              Preparaciones adicionales necesarias:
            </h4>
            <div class="text-slate-700 leading-relaxed text-sm">
      `;

      if (preparacionesUnicas.size === 0) {
         htmlPreparaciones += `<p class="italic text-slate-500 text-sm">No se requiere ninguna preparación específica para estos estudios (más allá del ayuno indicado arriba).</p>`;
      } else {
         htmlPreparaciones += `<ul class="list-disc pl-5 space-y-2 text-sm">`;
         Array.from(preparacionesUnicas).forEach(prep => {
            htmlPreparaciones += `<li>${prep}</li>`;
         });
         htmlPreparaciones += `</ul>`;
      }

      htmlPreparaciones += `
            </div>
          </div>
        </div>
      `;

      htmlPreparaciones += `
        <div class="mt-6 p-4 bg-indigo-50 border-l-4 border-indigo-700 rounded-r-lg shadow-sm disclaimer-print">
            <p class="text-indigo-900 print:text-black text-sm font-medium flex items-start gap-2">
                <i data-lucide="alert-circle" class="w-5 h-5 flex-shrink-0 mt-0.5 text-indigo-700 print:hidden"></i>
                <span><strong>Aviso importante:</strong> Lea atentamente estas instrucciones, su cumplimiento es imprescindible para garantizar la calidad de sus resultados.</span>
            </p>
        </div>
      `;

      preparacionesContenedor.innerHTML = htmlPreparaciones;
      if (typeof lucide !== 'undefined') {
        lucide.createIcons();
      }
    }

    function generarPDF() {
      const contenedorTemporal = document.createElement('div');
      contenedorTemporal.style.padding = '20px';
      contenedorTemporal.style.backgroundColor = '#ffffff';
      contenedorTemporal.style.fontFamily = 'sans-serif';
      
      const contenidoIndicaciones = document.getElementById('preparacionesContenedor').innerHTML;

      // Encabezado institucional optimizado con colores y estilos seguros para el renderizado del PDF
      contenedorTemporal.innerHTML = `
        <div style="background-color: #70006a; color: white; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; border-radius: 8px 8px 0 0; margin-bottom: 20px;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <div style="background: white; color: #70006a; font-weight: bold; padding: 6px 10px; border-radius: 6px; font-size: 13px;">LM</div>
            <div style="border-left: 2px solid white; height: 30px; margin: 0 8px;"></div>
            <h2 style="font-size: 15px; font-weight: bold; margin: 0; line-height: 1.2;">Laboratorio Maipú - Preparaciones para estudios</h2>
          </div>
        </div>
        ${contenidoIndicaciones}
      `;

      const opt = {
        margin:       0.5,
        filename:     'Preparaciones_Laboratorio_Maipu.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true, logging: false },
        jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(contenedorTemporal).save().catch(err => {
        console.error("Error al generar PDF:", err);
        alert("Hubo un error al generar el PDF. Por favor, intente nuevamente.");
      });
    }

    function enviarWhatsApp() {
      if (seleccionados.length === 0) return;

      let maxAyuno = 0;
      const preparacionesUnicas = new Set();
      const nombresEstudios = [];

      seleccionados.forEach(e => {
        nombresEstudios.push(e.nombre);
        if (e.ayunoHoras > maxAyuno) {
          maxAyuno = e.ayunoHoras;
        }
        if (e.preparacion && e.preparacion !== "Sin preparación específica") {
          let prepClean = e.preparacion
            .replace(/Ayuno de \d+\s*(horas|hs)\.?/gi, "")
            .replace(/Puede beber agua con moderación\.?/gi, "")
            .trim();
          if (prepClean) {
            preparacionesUnicas.add(prepClean);
          }
        }
      });

      let mensaje = "*INDICACIONES DE PREPARACIÓN MÉDICA*\n\n";
      
      mensaje += "*Estudios solicitados:*\n";
      nombresEstudios.forEach(nombre => {
        mensaje += `• ${nombre}\n`;
      });

      mensaje += "\n*Resumen de indicaciones:*\n";
      
      if (maxAyuno > 0) {
        mensaje += `⏰ *Ayuno mínimo:* ${maxAyuno} horas. Puede beber agua con moderación.\n\n`;
      }

      if (preparacionesUnicas.size > 0) {
        mensaje += "*Preparaciones adicionales:*\n";
        Array.from(preparacionesUnicas).forEach(prep => {
            mensaje += `👉 ${prep}\n\n`;
        });
      } else {
        mensaje += "_No se requiere ninguna preparación específica adicional._\n\n";
      }

      mensaje += "⚠️ *Aviso importante:* _Lea atentamente estas instrucciones, su cumplimiento es imprescindible para garantizar la calidad de sus resultados._\n";

      const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(mensaje)}`;
      window.open(url, '_blank');
    }
