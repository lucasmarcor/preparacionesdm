  <style>
    /* Estilos específicos para la impresión (Generación de PDF limpio) */
    @media print {
      /* Ocultar elementos de UI que no deben imprimirse */
      header > div > button, /* Botón Imprimir del encabezado */
      main > section:first-child, /* Columna izquierda (Buscador y Lista) */
      section > div:first-child, /* Cabecera de la columna derecha (Seleccionados) */
      section > div:nth-child(2), /* Tags de seleccionados */
      footer, /* Pie de página */
      .p-3.bg-slate-50.border-t.border-slate-200 { /* Botones inferiores en la columna derecha */
        display: none !important;
      }

      /* Ajustar el contenedor principal para ocupar todo el ancho */
      main {
        grid-template-columns: 1fr !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      /* Ajustar la columna derecha para la impresión */
      main > section:last-child {
        grid-column: 1 / -1 !important;
        box-shadow: none !important;
        border: none !important;
        margin: 0 !important;
        padding: 0 !important;
        height: auto !important;
      }

      /* Estilos para el título de las indicaciones en impresión */
      h3 {
        font-size: 20pt !important;
        margin-bottom: 20pt !important;
        color: black !important;
        font-weight: bold !important;
      }

      /* Estilos para los cuadros de preparación en impresión */
      #preparacionesContenedor > div > div {
        border: 1.5pt solid #ccc !important;
        margin-bottom: 15pt !important;
        padding: 10pt !important;
        page-break-inside: avoid; /* Evitar que se corten los cuadros */
      }

      body {
        background: white !important;
        color: black !important;
      }

      /* Configurar márgenes de página */
      @page {
        margin: 1.5cm;
      }
    }
  </style>
</head>

            <span>Estudios Seleccionados (<span id="contadorSeleccionados">0</span>)</span>
          </div>
          <button onclick="limpiarSeleccion()" class="text-xs text-[#70006a] hover:underline font-medium">Limpiar todo</button>
        </div>

        <div id="tagsSeleccionados" class="p-3 border-b border-slate-200 flex flex-wrap gap-1.5 max-h-32 overflow-y-auto bg-slate-50/50">
          <span class="text-xs text-slate-400 italic">Ningún estudio seleccionado</span>
        </div>

    function cargarBotonesCategorias() {
      const contenedor = document.getElementById("botonesCategorias");
      const categorias = [...new Set(estudiosBD.map(e => e.categoria))];
      
      const emojis = {
        "Hormonas": "🧪",
        "General": "🔬",
        "Orina": "💧",
        "Cultivos": "🧫"
      };

      let html = `
        <button onclick="filtrarPorCategoria('')" class="px-3 py-1.5 rounded-lg text-xs font-medium transition ${categoriaSeleccionada === '' ? 'bg-[#70006a] text-white shadow-sm' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">
          📋 Todos
        </button>
      `;

      categorias.forEach(cat => {
        const emoji = emojis[cat] || "🏷️";
        const activo = categoriaSeleccionada === cat;
        html += `
          <button onclick="filtrarPorCategoria('${cat}')" class="px-3 py-1.5 rounded-lg text-xs font-medium transition ${activo ? 'bg-[#70006a] text-white shadow-sm' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">
            ${emoji} ${cat}
          </button>
        `;
      });

      contenedor.innerHTML = html;
    }

    function filtrarPorCategoria(cat) {
      categoriaSeleccionada = cat;
      cargarBotonesCategorias();
      filtrarEstudios();
    }

    function filtrarEstudios() {
      const texto = document.getElementById("buscador").value.toLowerCase();

      const filtrados = estudiosBD.filter(e => {
        const coincideTexto = e.nombre.toLowerCase().includes(texto) || e.codigo.toLowerCase().includes(texto);
        const coincideCat = categoriaSeleccionada === "" || e.categoria === categoriaSeleccionada;
        return coincideTexto && coincideCat;
      });

      renderizarLista(filtrados);
    }

        return;

        const estaSeleccionado = seleccionados.some(s => s.codigo === e.codigo);
        return `
          <div 
            onclick="toggleEstudio('${e.codigo}')"
            class="p-3 border rounded-lg cursor-pointer transition flex items-center justify-between text-sm ${estaSeleccionado ? 'bg-pink-50/80 border-pink-300 shadow-sm' : 'bg-white border-slate-200 hover:border-slate-300'}"
          >
            <div class="flex items-center gap-3">
              <input type="checkbox" ${estaSeleccionado ? 'checked' : ''} onclick="event.stopPropagation(); toggleEstudio('${e.codigo}')" class="rounded text-[#70006a] focus:ring-[#70006a] w-4 h-4 cursor-pointer">
              <div>
                <span class="font-semibold text-slate-800">${e.nombre}</span>
                <span class="text-xs text-slate-500 block">${e.categoria} (Código: ${e.codigo})</span>
              </div>
            </div>
            ${e.ayunoHoras > 0 ? `<span class="text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-medium">Ayuno ${e.ayunoHoras}h</span>` : ''}
          </div>
        `;
      }).join('');
    }

    function toggleEstudio(codigo) {
      const index = seleccionados.findIndex(s => s.codigo === codigo);
      if (index > -1) {
        seleccionados.splice(index, 1);
      } else {
        const estudio = estudiosBD.find(e => e.codigo === codigo);
        if (estudio) seleccionados.push(estudio);
      }
      filtrarEstudios();
      actualizarSeleccion();
      actualizarPreparaciones();
    }

    function limpiarSeleccion() {
      seleccionados = [];
      filtrarEstudios();
      actualizarSeleccion();
      actualizarPreparaciones();
    }

    function actualizarSeleccion() {
      document.getElementById("contadorSeleccionados").textContent = seleccionados.length;
      const tagsContainer = document.getElementById("tagsSeleccionados");
      const btnWhatsApp = document.getElementById("btnWhatsApp");

      btnWhatsApp.disabled = seleccionados.length === 0;

      if (seleccionados.length === 0) {
        tagsContainer.innerHTML = `<span class="text-xs text-slate-400 italic">Ningún estudio seleccionado</span>`;
        return;
      }

      tagsContainer.innerHTML = seleccionados.map(e => `
        <span class="inline-flex items-center gap-1 bg-pink-100 text-[#70006a] text-xs px-2.5 py-1 rounded-md font-medium">
          ${e.nombre}
          <button onclick="toggleEstudio('${e.codigo}')" class="hover:text-pink-950 font-bold ml-0.5">×</button>
        </span>
      `).join('');
    }

    // Actualiza la visualización agrupando las prácticas por su preparación idéntica
    function actualizarPreparaciones() {
      const preparacionesContenedor = document.getElementById('preparacionesContenedor');
      if (!preparacionesContenedor) return;

      if (seleccionados.length === 0) {
        preparacionesContenedor.innerHTML = `<p class="text-slate-500 italic text-sm">Selecciona estudios de tu orden médica para ver las indicaciones.</p>`;
        return;
      }

      let htmlPreparaciones = '';

      const maxAyuno = Math.max(...seleccionados.map(e => e.ayunoHoras || 0));
      if (maxAyuno > 0) {
        htmlPreparaciones += `
          <div class="mb-4 p-3 bg-amber-50 border-l-4 border-amber-500 text-amber-700 rounded-r-lg text-sm flex items-center gap-2">
            <i data-lucide="clock" class="w-5 h-5 flex-shrink-0"></i>
            <span><strong>Ayuno Requerido:</strong> Se requiere un ayuno mínimo de <strong>${maxAyuno} horas</strong> antes de la extracción.</span>
          </div>
        `;
      }

      // Agrupar prácticas por texto de preparación
      const gruposPorPreparacion = {};
      seleccionados.forEach(e => {
        const prep = e.preparacion || "Sin preparación específica";
        if (!gruposPorPreparacion[prep]) {
          gruposPorPreparacion[prep] = [];
        }
        gruposPorPreparacion[prep].push(e.nombre);
      });

      htmlPreparaciones += `<div class="space-y-3">`;
      Object.entries(gruposPorPreparacion).forEach(([prep, nombres]) => {
        htmlPreparaciones += `
          <div class="p-3.5 bg-white border border-slate-200 rounded-lg shadow-sm">
            <div class="font-bold text-[#70006a] text-sm mb-1">
              📌 ${nombres.join(', ')}
            </div>
            <div class="text-slate-700 text-xs leading-relaxed">
              ${prep}
            </div>
          </div>
        `;
      });
      htmlPreparaciones += `</div>`;

      preparacionesContenedor.innerHTML = htmlPreparaciones;
      if (typeof lucide !== 'undefined') {
        lucide.createIcons();
      }
    }

    // Envía el mensaje por WhatsApp agrupando los estudios y mostrando la preparación correspondiente
    function enviarWhatsApp() {
      if (seleccionados.length === 0) return;

      let mensaje = "*INDICACIONES DE PREPARACIÓN MÉDICA - LABORATORIO MAIPÚ*\n\n";
      mensaje += "*Estudios solicitados:*\n";
      seleccionados.forEach((e, i) => {
        mensaje += `${i + 1}. ${e.nombre}\n`;
      });

      const maxAyuno = Math.max(...seleccionados.map(e => e.ayunoHoras || 0));
      if (maxAyuno > 0) {
        mensaje += `\n⏰ *Ayuno sugerido:* ${maxAyuno} horas.\n`;
      }

      // Agrupar prácticas por preparación para el mensaje
      const gruposPorPreparacion = {};
      seleccionados.forEach(e => {
        const prep = e.preparacion || "Sin preparación específica";
        if (!gruposPorPreparacion[prep]) {
          gruposPorPreparacion[prep] = [];
        }
        gruposPorPreparacion[prep].push(e.nombre);
      });

      mensaje += "\n*Indicaciones detalladas:*\n";
      Object.entries(gruposPorPreparacion).forEach(([prep, nombres]) => {
        mensaje += `• *Prácticas:* ${nombres.join(', ')}\n  *Preparación:* ${prep}\n\n`;
      });

      mensaje += "_Por favor ante cualquier duda consulte previamente con su médico._";

      const url = `https://api.whatsapp.com/send?phone=${TELEFONO_CONTACTO}&text=${encodeURIComponent(mensaje)}`;
      window.open(url, '_blank');
    }
  </script>
</body>
</html>
